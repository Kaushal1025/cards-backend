# Apache site for the Cards app. One address serves both halves:
#   /api/...       forwarded (reverse proxied) to the Node API on this machine
#   everything else the React frontend's built files, from /var/www/cards
#
# Install it once (see tutorials/07-deploy-backend):
#   scp deploy/apache-cards.conf root@YOUR-SERVER:/etc/apache2/sites-available/cards.conf
# then, on the droplet, replace YOUR-HOSTNAME below with your hostname,
# and enable it with a2ensite. Certbot later copies this into an HTTPS site.

<VirtualHost *:80>
    # Apache picks this site when a request is for this hostname. Requests
    # for the droplet's bare IP address still go to the default site.
    ServerName YOUR-HOSTNAME

    # --- The API: reverse proxy to Node -----------------------------------
    # Requests whose path starts with /api are passed to the API, which
    # listens on port 5000 on this same machine. Port 5000 stays closed in
    # the firewall; only Apache talks to it.
    ProxyPass        /api http://127.0.0.1:5000/api
    # Rewrite redirect addresses from the API (like http://127.0.0.1:5000/...)
    # so they point back at this site instead.
    ProxyPassReverse /api http://127.0.0.1:5000/api
    # Pass the original Host header through to Express
    ProxyPreserveHost On

    # --- The frontend: static files --------------------------------------
    DocumentRoot /var/www/cards

    <Directory /var/www/cards>
        Require all granted
        # Don't list folder contents, and ignore .htaccess files
        Options -Indexes
        AllowOverride None
        # React Router: a path with no matching file (like /cards) gets
        # index.html, and the React app shows the right page.
        FallbackResource /index.html
    </Directory>

    # ...but a missing script or stylesheet should be a plain 404, not
    # index.html (which the browser would fail to run as JavaScript)
    <Directory /var/www/cards/assets>
        FallbackResource disabled
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/cards-error.log
    CustomLog ${APACHE_LOG_DIR}/cards-access.log combined
</VirtualHost>
