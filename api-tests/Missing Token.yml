info:
  name: Missing Token
  type: http
  seq: 10

http:
  method: GET
  url: "{{baseURL}}/api/users/{{userId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("a protected route without a token responds 401", function () {
          expect(res.getStatus()).to.equal(401);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Proves the account routes are protected: this request deliberately sends no token.
